    /*
       COURSE DESCRIPTIONS
    */

    const empirical =
        "Planung, Durchführung, Auswertung und " +
        "Verschriftlichung einer empirischen Studie";

    const accompanying =
        "Laufende Abschlussarbeiten in der Arbeitseinheit " +
        "Entwicklung von Sprache, Lernen und Handlung";

    const generalPsych =
        "Lernen und Sprache – Grundlagen des Lernens " +
        "und der Sprachverarbeitung";

    const introPsych =
        "Kleingruppenpräsentationen zur Geschichte und " +
        "zu Anwendungsfeldern der Psychologie; " +
        "Einführung in wissenschaftliches Arbeiten " +
        "und APA-Zitation";

    const methods =
        "Statistische Analyse von Lesezeitdaten mit R; " +
        "Datenvisualisierung mit Rmisc; lineare Modelle " +
        "und lineare Mixed-Effects-Modelle; Modellierung " +
        "von Probanden-, Item- und Trial-Varianz; " +
        "Random-Effects-Strukturen; Kontrastkodierung " +
        "und Interpretation von Modellparametern";

    const statistics =
        "Datenaufbereitung und -exploration in R; " +
        "deskriptive Statistik; t-Tests; " +
        "Chi-Quadrat-Tests; Korrelationsanalysen; " +

    /*
       HELPER FOR CREATING COURSES
    */

    function course(title, sws, description, type="Seminar") {
        return {
            title: title,
            sws: sws,
            description: description,
            type: type
        };
    }

    function empiricalCourse(sws) {
        return course(
            "Empirisches Projektmodul",
            sws,
            empirical
        );
    }

    function accompanyingCourse() {
        return course(
            "Begleitseminar",
            2,
            accompanying
        );
    }

    function generalPsychCourse() {
        return course(
            "Allgemeine Psychologie II",
            1,
            generalPsych,
            "Vorlesung"
        );
    }

    function methodsCourse() {
        return course(
            "Forschungsspezifische Methoden und Evaluation (FM3)",
            2,
            methods
        );
    }

    function akepp(description) {
        return course(
            "Angewandte und Kognitive Entwicklungs- " +
            "und Pädagogische Psychologie (AKEPP)",
            2,
            description
        );
    }

    function introCourse() {
        return course(
            "Einführung in die Psychologie",
            2,
            introPsych
        );
    }

    function statisticsCourse() {
        return course(
            "Statistics with R",
            null,
            statistics,
            "Vorlesungsbegleitendes Tutorial"
        );
    }

    /*
       DEGREE LABELS
    */

    const degreeLabels = {
        BSc: "Bachelor of Science Psychology",
        MSc: "Master of Science Psychology",
        LST: "Bachelor of Science Language Science and Technology"
    };


    /*
       DISPLAY TEACHING HISTORY
    */

    const teachingList =
        document.getElementById("teaching-list");

    teaching.forEach(entry => {

        const semesterDiv =
            document.createElement("div");

        semesterDiv.className = "semester";

        const yearDiv =
            document.createElement("div");

        yearDiv.className = "semester-year";
        yearDiv.textContent = entry.semester;

        const contentDiv =
            document.createElement("div");

        entry.groups.forEach(group => {

            const groupDiv =
                document.createElement("div");

            groupDiv.className = "degree-group";

            const degreeDiv =
                document.createElement("div");

            degreeDiv.className = "degree";
            degreeDiv.textContent =
                degreeLabels[group.degree];

            groupDiv.appendChild(degreeDiv);

            group.courses.forEach(item => {

                const courseDiv =
                    document.createElement("div");

                courseDiv.className = "course";

                const titleDiv =
                    document.createElement("div");

                titleDiv.className = "course-title";

                titleDiv.textContent =
                    item.type + ": " +
                    item.title +
                    (item.sws !== null
                        ? " (" + item.sws + " SWS)"
                        : "");

                const descriptionDiv =
                    document.createElement("div");

                descriptionDiv.className =
                    "course-description";

                descriptionDiv.textContent =
                    "Inhalt: " + item.description;

                courseDiv.appendChild(titleDiv);
                courseDiv.appendChild(descriptionDiv);

                groupDiv.appendChild(courseDiv);

            });

            contentDiv.appendChild(groupDiv);

        });

        semesterDiv.appendChild(yearDiv);
        semesterDiv.appendChild(contentDiv);

        teachingList.appendChild(semesterDiv);

    });

    </script>
